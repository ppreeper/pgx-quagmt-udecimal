name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Allow workflow to push badge back to the repository
permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      PGX_TEST_DATABASE: postgres://postgres:postgres@localhost:5432/testdb

    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.25"
          cache: true

      - name: Test (with coverage)
        run: |
          go test -race -coverprofile=coverage.out -covermode=atomic ./...

      - name: Show coverage
        run: go tool cover -func=coverage.out

      - name: Generate coverage badge
        run: |
          COVERAGE=$(go tool cover -func=coverage.out | grep total | awk '{print $3}' | tr -d '%')
          COLOR=$(echo "$COVERAGE" | awk '{if ($1 >= 80) print "#4c1"; else if ($1 >= 60) print "#dfb317"; else print "#e05d44"}')
          mkdir -p .github/badges
          cat > .github/badges/coverage.svg <<SVG
          <svg xmlns="http://www.w3.org/2000/svg" width="106" height="20">
            <linearGradient id="b" x2="0" y2="100%">
              <stop offset="0" stop-color="#bbb" stop-opacity=".1"/>
              <stop offset="1" stop-opacity=".1"/>
            </linearGradient>
            <mask id="a">
              <rect width="106" height="20" rx="3" fill="#fff"/>
            </mask>
            <g mask="url(#a)">
              <path fill="#555" d="M0 0h63v20H0z"/>
              <path fill="${COLOR}" d="M63 0h43v20H63z"/>
              <path fill="url(#b)" d="M0 0h106v20H0z"/>
            </g>
            <g fill="#fff" text-anchor="middle" font-family="Verdana,Geneva,DejaVu Sans,sans-serif" text-rendering="geometricPrecision" font-size="11">
              <text x="32" y="14" fill="#010101" fill-opacity=".3">coverage</text>
              <text x="32" y="14">coverage</text>
              <text x="85" y="14" fill="#010101" fill-opacity=".3">${COVERAGE}%</text>
              <text x="85" y="14">${COVERAGE}%</text>
            </g>
          </svg>
          SVG

      - name: Commit coverage badge
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "chore: update coverage badge"
          file_pattern: .github/badges/coverage.svg
          skip_checkout: true
